services:
  class-board-nginx:
    build: ./nginx
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - class-board-api
    networks:
      - class-board-network
  class-board-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api
    ports:
      - 3000:3000
    volumes:
      - .:/app
      - /app/node_modules
      - /app/node_modules/.pnpm
    depends_on:
      class-board-pg:
        condition: service_healthy
      class-board-redis:
        condition: service_healthy
    develop:
      watch:
        - path: ./src
          action: sync
          target: .:/app
    networks:
      - class-board-network
    stdin_open: true
    tty: true
    command: sh -c "pnpm start"

  class-board-pg:
    image: bitnami/postgresql
    container_name: postgres
    ports:
      - 5433:5432
    env_file: .env
    environment:
      - POSTGRESQL_USERNAME=${DB_USER}
      - POSTGRESQL_PASSWORD=${DB_PASSWORD}
      - POSTGRESQL_DATABASE=${DB_NAME}

    healthcheck:
      test: ["CMD-SHELL", "psql -U ${DB_USER} -d ${DB_NAME} -c 'SELECT 1'"]
      interval: 20s
      timeout: 10s
      retries: 3

    restart: unless-stopped

    networks:
      - class-board-network
  class-board-redis:
    image: bitnami/redis
    container_name: redis
    ports:
      - 6379:6379
    env_file: .env
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 15s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - class-board-network

networks:
  class-board-network:
    driver: bridge
